name: Restore homepage runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-homepage-runtime.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore stable homepage files
        run: |
          git checkout 63bacf425917f719552d822e70bd59da6c7289d3 -- \
            index.html \
            scripts/script_loader.js \
            scripts/script.js \
            css/site-effects.css

      - name: Remove only mouse-follow effect
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/script_loader.js')
          text = path.read_text(encoding='utf-8')
          start_marker = '/* reactive liquid glass */'
          end_marker = '/* hero glitch title */'

          start = text.find(start_marker)
          end = text.find(end_marker)
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('Expected pointer-effect block was not found')

          text = text[:start].rstrip() + '\n\n' + text[end:]
          path.write_text(text, encoding='utf-8')

      - name: Validate restored runtime
        run: |
          node --check scripts/script_loader.js
          node --check scripts/script.js
          grep -q 'const MIN_LOADER_TIME = 7000' scripts/script_loader.js
          grep -q 'hero glitch title' scripts/script_loader.js
          grep -q 'sequential reveal' scripts/script.js
          grep -q 'type-caret' css/site-effects.css
          grep -q 'glitch-main' css/site-effects.css
          grep -q '#site-loader' css/site-effects.css
          if grep -q 'reactive liquid glass' scripts/script_loader.js; then
            echo 'Mouse-follow block still present'
            exit 1
          fi

      - name: Remove temporary workflow
        run: rm -f .github/workflows/restore-homepage-runtime.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore homepage loading and text animations"
          git push origin main
