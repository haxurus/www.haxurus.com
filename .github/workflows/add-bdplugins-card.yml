name: Add BetterDiscord plugins card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-bdplugins-card.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add BetterDiscord plugins card
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          url = 'https://github.com/haxurus/BDPlugins'

          if url not in html:
              marker = '<section class="category" id="discord"><h2>Discord</h2><div class="links-grid">'
              card = '<a class="link-card" href="https://github.com/haxurus/BDPlugins" rel="noopener noreferrer" target="_blank"><div class="card-icon thumb small-thumb"><img alt="BetterDiscord plugins" src="img/social/bdplugins.png"/></div><div class="card-body centered"><span class="card-title">BetterDiscord\'s Plugins</span></div><div class="card-more">⋮</div></a>'
              if marker not in html:
                  raise SystemExit('Discord section marker not found')
              html = html.replace(marker, marker + card, 1)
              path.write_text(html, encoding='utf-8')
          PY

      - name: Validate change
        run: |
          grep -q 'https://github.com/haxurus/BDPlugins' index.html
          grep -q 'img/social/bdplugins.png' index.html
          grep -q "BetterDiscord's Plugins" index.html

      - name: Remove workflow
        run: rm -f .github/workflows/add-bdplugins-card.yml

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/add-bdplugins-card.yml
          git commit -m "Add BetterDiscord plugins link"
          git push
