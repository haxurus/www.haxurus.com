name: Fix BetterDiscord card order and section scrolling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-bdplugins-order-scroll.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reorder card and restore mandatory snapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          pattern = re.compile(r'<a class="link-card" href="https://github\.com/haxurus/BDPlugins".*?</a>')
          match = pattern.search(html)
          if not match:
              raise SystemExit('BetterDiscord card not found')

          card = match.group(0)
          html = html[:match.start()] + html[match.end():]
          card = card.replace('<a class="link-card"', '<a class="link-card" data-no-badges="true"', 1)

          discord_start = html.index('<section class="category" id="discord">')
          discord_end = html.index('</section>', discord_start)
          section = html[discord_start:discord_end]
          links_grid_end = section.rfind('</div>')
          section = section[:links_grid_end] + card + section[links_grid_end:]
          html = html[:discord_start] + section + html[discord_end:]
          index_path.write_text(html, encoding='utf-8')

          css_path = Path('css/site-effects.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('scroll-snap-type: y proximity;', 'scroll-snap-type: y mandatory;', 1)
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Validate changes
        run: |
          grep -q 'data-no-badges="true"' index.html
          grep -q 'scroll-snap-type: y mandatory' css/site-effects.css
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          start = html.index('<section class="category" id="discord">')
          end = html.index('</section>', start)
          section = html[start:end]
          assert section.index('discord.gg/WdBsEJhy33') < section.index('discord.gg/celestiaita') < section.index('github.com/haxurus/BDPlugins')
          PY

      - name: Remove workflow
        run: rm -f .github/workflows/fix-bdplugins-order-scroll.yml

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html css/site-effects.css .github/workflows/fix-bdplugins-order-scroll.yml
          git commit -m "Fix BetterDiscord card order and section scrolling"
          git push
