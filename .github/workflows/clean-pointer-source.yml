name: Clean pointer source code

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-pointer-source.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove pointer source code and duplicate overrides
        shell: python
        run: |
          from pathlib import Path
          import re

          loader = Path('scripts/script_loader.js')
          text = loader.read_text(encoding='utf-8')

          old_block = '''/* combined effects stylesheet */
          (() => {
            const href = 'site-effects.css';
            if (!document.querySelector(`link[href="${href}"]`)) {
              const link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = href;
              document.head.appendChild(link);
            }
            if (!document.querySelector('style[data-hero-summer-banner]')) {
              const override = document.createElement('style');
              override.setAttribute('data-hero-summer-banner', '');
              override.textContent = '.hero{background:#020805!important}.hero::before{background:url("img/hero/banner_summer.png") center/cover no-repeat!important}';
              document.head.appendChild(override);
            }
          })();'''

          new_block = '''/* hero summer banner */
          (() => {
            if (!document.querySelector('style[data-hero-summer-banner]')) {
              const override = document.createElement('style');
              override.setAttribute('data-hero-summer-banner', '');
              override.textContent = '.hero{background:#020805!important}.hero::before{background:url("img/hero/banner_summer.png") center/cover no-repeat!important}';
              document.head.appendChild(override);
            }
          })();'''

          if old_block in text:
              text = text.replace(old_block, new_block)
          else:
              text = re.sub(
                  r'/\* combined effects stylesheet \*/\s*\(\(\) => \{.*?\}\)\(\);',
                  new_block,
                  text,
                  count=1,
                  flags=re.S,
              )

          loader.write_text(text, encoding='utf-8')

          effects = Path('css/site-effects.css')
          css = effects.read_text(encoding='utf-8')

          css = css.replace(
              '--liquid-x:50%;--liquid-y:50%;--liquid-tilt-x:0deg;--liquid-tilt-y:0deg',
              ''
          )
          css = css.replace(
              'radial-gradient(circle at var(--liquid-x) var(--liquid-y),rgba(255,255,255,.44),transparent 16%),',
              ''
          )
          css = css.replace(
              '.link-card,.playlist-card,.quick-link{transform:perspective(900px) rotateX(var(--liquid-tilt-x)) rotateY(var(--liquid-tilt-y));will-change:transform,background,backdrop-filter}',
              ''
          )

          # Remove the defensive override added in the previous change, if it exists.
          css = re.sub(
              r'/\* Native pointer normalization \*/.*?\.mouse-cursor\s*\{\s*display:\s*none\s*!important;?\s*\}',
              '',
              css,
              flags=re.S,
          )
          effects.write_text(css, encoding='utf-8')

          root_override = Path('site-effects.css')
          if root_override.exists():
              root_override.unlink()

          workflow = Path('.github/workflows/clean-pointer-source.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove custom pointer source code"
          git push origin main
