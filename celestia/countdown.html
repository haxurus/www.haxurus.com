<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <title>Celestia - Countdown</title>

  <style>
    :root {
      --bg: #111111;
      --primary: #3f3c54;
      --dark: #191826;
      --light: #605d87;
      --silver: #c2c7d0;
      --white: #e5e5e5;
      --black: #111111;
      --text: var(--white);
      --muted: rgba(194, 199, 208, 0.72);
      --panel: rgba(25, 24, 38, 0.62);
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    .background {
      position: fixed;
      inset: -30px;
      z-index: 0;
      background-image: url("../img/celestia/hero.webp");
      background-size: cover;
      background-position: center;
      filter: blur(16px) saturate(1.08);
      transform: scale(1.05);
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(0, 0, 0, 0.16), rgba(0, 0, 0, 0.52)),
        rgba(17, 17, 17, 0.34);
    }

    .glow {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 45%, rgba(96, 93, 135, 0.12), transparent 28%),
        linear-gradient(135deg, rgba(194, 199, 208, 0.04), transparent 40%, rgba(63, 60, 84, 0.08));
    }

    main {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 980px);
      padding: clamp(30px, 6vw, 64px);
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(25, 24, 38, 0.76), rgba(17, 17, 17, 0.62));
      box-shadow:
        0 28px 90px rgba(0, 0, 0, 0.48),
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 0 50px rgba(96, 93, 135, 0.10);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 18px;
      color: var(--silver);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--light);
      box-shadow: 0 0 18px rgba(96, 93, 135, 0.95);
      animation: pulse 1.8s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(2.2rem, 7vw, 5.4rem);
      line-height: 0.96;
      letter-spacing: -0.055em;
      font-weight: 900;
      text-wrap: balance;
      text-shadow: 0 6px 30px rgba(0, 0, 0, 0.45);
    }

    .accent {
      color: var(--silver);
      text-shadow: 0 0 24px rgba(96, 93, 135, 0.32);
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-top: clamp(30px, 5vw, 48px);
    }

    .time-box {
      position: relative;
      padding: clamp(18px, 4vw, 30px) 12px;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(255, 255, 255, 0.035);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .time-box::before {
      content: "";
      position: absolute;
      top: 0;
      left: 20%;
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--light), transparent);
      opacity: 0.85;
    }

    .value {
      display: block;
      font-variant-numeric: tabular-nums;
      font-size: clamp(2rem, 6vw, 4.2rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.05em;
    }

    .label {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: clamp(0.63rem, 1.6vw, 0.78rem);
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .line {
      width: min(320px, 60%);
      height: 1px;
      margin: 32px auto 0;
      background: linear-gradient(90deg, transparent, rgba(194, 199, 208, 0.25), rgba(96, 93, 135, 0.85), rgba(63, 60, 84, 0.75), transparent);
    }

    .footer-note {
      margin-top: 19px;
      color: var(--muted);
      font-size: clamp(0.95rem, 2vw, 1.12rem);
      letter-spacing: 0.04em;
    }

    .social-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 17px;
      border: 1px solid rgba(194, 199, 208, 0.20);
      border-radius: 999px;
      color: var(--white);
      background: rgba(96, 93, 135, 0.12);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 750;
      letter-spacing: 0.01em;
      transition: transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .social-link:hover,
    .social-link:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(194, 199, 208, 0.52);
      background: rgba(96, 93, 135, 0.24);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
      outline: none;
    }

    .expired .countdown {
      display: none;
    }

    .expired h1::after {
      content: "È arrivato il momento.";
      display: block;
      margin-top: 28px;
      color: var(--silver);
      font-size: clamp(1.25rem, 3vw, 2rem);
      letter-spacing: -0.02em;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.55; transform: scale(0.88); }
      50% { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 650px) {
      body { overflow-y: auto; }

      .card {
        padding: 30px 18px;
        border-radius: 22px;
      }

      .countdown {
        grid-template-columns: repeat(2, 1fr);
      }

      .footer-note {
        line-height: 1.6;
      }

      .social-links {
        flex-direction: column;
      }

      .social-link {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <main>
    <section class="card" id="countdownCard">
      <div class="eyebrow">Celestia</div>
      <h1>Qualcosa sta per <span class="accent">accadere.</span></h1>

      <div class="countdown" aria-label="Conto alla rovescia">
        <div class="time-box">
          <span class="value" id="days">00</span>
          <span class="label">Giorni</span>
        </div>
        <div class="time-box">
          <span class="value" id="hours">00</span>
          <span class="label">Ore</span>
        </div>
        <div class="time-box">
          <span class="value" id="minutes">00</span>
          <span class="label">Minuti</span>
        </div>
        <div class="time-box">
          <span class="value" id="seconds">00</span>
          <span class="label">Secondi</span>
        </div>
      </div>

      <div class="line"></div>
      <div class="footer-note">Venerdì 18 settembre 2026 · ore 22:00</div>

      <nav class="social-links" aria-label="Link Celestia">
        <a class="social-link" href="https://discord.gg/8d4ZRhRN6y" target="_blank" rel="noopener noreferrer">Discord</a>
        <a class="social-link" href="https://vrc.group/CELEST.7570" target="_blank" rel="noopener noreferrer">Gruppo VRChat</a>
        <a class="social-link" href="https://instagram.com/haxurus.vrc" target="_blank" rel="noopener noreferrer">Instagram</a>
      </nav>
    </section>
  </main>

  <script>
    // 18 settembre 2026, ore 22:00 in Italia (CEST, UTC+2)
    const deadline = new Date('2026-09-18T22:00:00+02:00').getTime();

    const els = {
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      seconds: document.getElementById('seconds'),
      card: document.getElementById('countdownCard')
    };

    const pad = (value) => String(value).padStart(2, '0');

    function updateCountdown() {
      const now = Date.now();
      const distance = deadline - now;

      if (distance <= 0) {
        els.days.textContent = '00';
        els.hours.textContent = '00';
        els.minutes.textContent = '00';
        els.seconds.textContent = '00';
        els.card.classList.add('expired');
        clearInterval(timer);
        return;
      }

      const days = Math.floor(distance / 86400000);
      const hours = Math.floor((distance % 86400000) / 3600000);
      const minutes = Math.floor((distance % 3600000) / 60000);
      const seconds = Math.floor((distance % 60000) / 1000);

      els.days.textContent = pad(days);
      els.hours.textContent = pad(hours);
      els.minutes.textContent = pad(minutes);
      els.seconds.textContent = pad(seconds);
    }

    let timer = null;
    updateCountdown();
    if (!els.card.classList.contains('expired')) {
      timer = setInterval(updateCountdown, 1000);
    }
  </script>
</body>
</html>
